<!doctype html>
<html lang="es">
<head>
  <!--
    FFT México - Static Thanks Template
    Template Version: 1.0.0

    Companion confirmation page for forms created from assets/templetes/form_v1.

    Responsibility areas:
    TEMPLATE CORE — protected reusable infrastructure. Do not modify unless technically necessary.
    TEMPLATE CONFIGURATION — values that MUST be customized for each implementation without changing the surrounding structure.
    PAGE-SPECIFIC CONTENT — optional extra blocks belonging to the individual confirmation page.

    Replace every {{PLACEHOLDER_NAME}} marker before production.
    A finished production page must contain ZERO unresolved {{...}} placeholders.
  -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- TEMPLATE CONFIGURATION -->
  <title>{{THANKS_TITLE}} | FFT México</title>
  <meta name="description" content="{{THANKS_META_DESCRIPTION}}">

  <!-- =====================================================
        TEMPLATE CORE — DO NOT MODIFY FOR INDIVIDUAL PAGES
  ====================================================== -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
        crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <!-- Parent form styles are expected when this folder is deployed as forms/<form>/thanks/. -->
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- =====================================================
       TEMPLATE CORE — DO NOT MODIFY FOR INDIVIDUAL PAGES
  ====================================================== -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top px-3 px-md-5 fft-navbar">
      <div class="container-fluid">
        <!-- These relative paths depend on the expected forms/<form>/thanks/ deployment structure. -->
        <a class="navbar-brand" href="{{FORM_HOME_URL}}" aria-label="FFT México">
          <img src="../../../assets/img/common/fft_logonormal_headers.webp"
               alt="FFT México"
               height="30"
               class="d-inline-block align-text-top">
        </a>
        <div class="ms-auto">
          <span class="navbar-text text-white fw-medium">
            <i class="bi {{NAV_ICON}} me-1" aria-hidden="true"></i>
            {{NAV_LABEL}}
          </span>
        </div>
      </div>
    </nav>
  </header>

  <main class="confirmation-main">
    <section class="container py-5" aria-labelledby="confirmationTitle">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">
          <article class="form-section confirmation-card text-center">
            <div class="confirmation-icon" aria-hidden="true">
              <i class="bi {{THANKS_ICON}}"></i>
            </div>
            <!-- TEMPLATE CONFIGURATION -->
            <p class="fft-eyebrow mb-2">{{THANKS_EYEBROW}}</p>
            <h1 id="confirmationTitle" class="display-6 fw-bold mb-3">{{THANKS_HEADING}}</h1>
            <p class="lead text-muted mb-4">{{THANKS_INTRODUCTION}}</p>

            <div class="confirmation-detail text-start" role="note">
              <i class="bi {{THANKS_DETAIL_ICON}}" aria-hidden="true"></i>
              <p class="mb-0">{{THANKS_DETAIL}}</p>
            </div>

            <!-- =====================================================
                 PAGE-SPECIFIC CONTENT — EDIT FOR EACH IMPLEMENTATION

                 Insert optional extra confirmation blocks in this
                 single area (extra notes, next steps, or links).
                 Do not replace the confirmation shell above.
            ====================================================== -->

            <!-- TEMPLATE CORE -->
            <div class="form-actions justify-content-center">
              <a class="btn btn-primary btn-lg" href="{{THANKS_ACTION_URL}}">
                <i class="bi {{THANKS_ACTION_ICON}} me-2" aria-hidden="true"></i>{{THANKS_ACTION_LABEL}}
              </a>
            </div>
          </article>
        </div>
      </div>
    </section>
  </main>

  <!-- TEMPLATE CORE -->
  <footer class="fft-footer text-center py-4">
    <div class="container">
      <p class="mb-1">&copy; <span id="currentYear"></span> FFT México. Todos los derechos reservados.</p>
      <!-- TEMPLATE CONFIGURATION -->
      <p class="mb-0 small">{{FOOTER_DESCRIPTION}}</p>
    </div>
  </footer>

  <!-- TEMPLATE CORE -->
  <script src="main.js"></script>
</body>
</html>
