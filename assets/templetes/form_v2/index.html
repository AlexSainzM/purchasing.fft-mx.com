<!doctype html>
<html lang="es">
<head>
  <!--
    FFT México - Static Form Template
    Template Version: 1.1.0

    Responsibility areas:
    TEMPLATE CORE — protected reusable infrastructure. Do not modify unless technically necessary.
    TEMPLATE CONFIGURATION — values that MUST be customized for each implementation without changing the surrounding structure.
    FORM-SPECIFIC CONTENT — questions and controls belonging to the individual form.

    Replace every {{PLACEHOLDER_NAME}} marker before production.
    A finished production form must contain ZERO unresolved {{...}} placeholders.
  -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- TEMPLATE CONFIGURATION -->
  <title>{{FORM_TITLE}} | FFT México</title>
  <meta name="description" content="{{FORM_META_DESCRIPTION}}">

  <!-- =====================================================
        TEMPLATE CORE — DO NOT MODIFY FOR INDIVIDUAL FORMS
  ====================================================== -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
        crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- =====================================================
       TEMPLATE CORE — DO NOT MODIFY FOR INDIVIDUAL FORMS
  ====================================================== -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top px-3 px-md-5 fft-navbar">
      <div class="container-fluid">
        <!-- These relative paths depend on the expected FFT internal-services deployment structure. -->
        <a class="navbar-brand" href="#" aria-label="FFT México">
          <img src="../../img/common/fft_logonormal_headers.webp"
               alt="FFT México"
               height="30"
               class="d-inline-block align-text-top">
        </a>
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Mostrar u ocultar navegación">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <!-- TEMPLATE CONFIGURATION -->
              <a class="nav-link" href="{{NAV_HREF}}">
                <i class="bi {{NAV_ICON}} me-1" aria-hidden="true"></i>
                {{NAV_LABEL}}
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container pt-5 mt-5">
      <div class="row">
        <div class="col-lg-10 mx-auto">
          <!-- TEMPLATE CONFIGURATION -->
          <p class="fft-eyebrow mb-2">{{FORM_EYEBROW}}</p>
          <h1 class="display-5 fw-bold mb-3">{{FORM_TITLE}}</h1>
          <p class="lead mb-2">{{FORM_INTRODUCTION}}</p>
          <p class="text-muted mb-4">{{FORM_INSTRUCTIONS}}</p>

          <!-- TEMPLATE CORE -->
          <div class="alert alert-warning border-0 shadow-sm fft-required-notice" role="note">
            <i class="bi bi-asterisk text-danger" aria-hidden="true"></i>
            Los campos marcados con <span class="required-indicator" aria-hidden="true">*</span> son obligatorios.
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="container py-5" aria-labelledby="formSectionTitle">
      <div class="row mb-5">
        <div class="col-lg-10 mx-auto">
          <!-- TEMPLATE CORE form shell. Customize only action={{FORMSPREE_ENDPOINT}}. -->
          <form id="mainForm"
                class="fft-form needs-validation"
                action="{{FORMSPREE_ENDPOINT}}"
                method="POST"
                novalidate>
            <input type="hidden" name="_next" value="{{FORM_THANKS_URL}}">
            <div class="form-section">
              <!-- TEMPLATE CONFIGURATION -->
              <h2 id="formSectionTitle" class="form-section-title">{{SECTION_TITLE}}</h2>
              <p class="form-section-description">{{SECTION_DESCRIPTION}}</p>

              <!-- =====================================================
                   FORM-SPECIFIC CONTENT — EDIT FOR EACH IMPLEMENTATION

                   Insert all form questions in this single area.

                   Field convention: pNN_short_description
                   Examples: p01_nombre, p02_departamento
                   Use lowercase snake_case without accents and a
                   two-digit question number. Keep id and name equal
                   whenever possible.

                   Conditional fields:
                   - Hide inactive containers with Bootstrap's d-none.
                   - Disable inactive controls so they cannot block native validation.
                   - Fields required when active must use data-required="true".
                   - Apply required only while a conditional section is active.

                   Grouped controls:
                  - Radio options belonging to one question must share the same name.
                  - Use unique IDs for each option.
                  - Apply required to the first radio of a required group.
                  - Validation feedback for a radio/checkbox group belongs to the group, not to an individual option.
                  - Use fieldset + legend for grouped controls.
              ====================================================== -->

              <!-- TEMPLATE CORE -->
              <div class="form-actions">
                <button class="btn btn-primary btn-lg" type="submit">
                  <i class="bi {{SUBMIT_ICON}} me-2" aria-hidden="true"></i>{{SUBMIT_LABEL}}
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- TEMPLATE CORE -->
  <footer class="fft-footer text-center py-4 mt-5">
    <div class="container">
      <p class="mb-1">&copy; <span id="currentYear"></span> FFT México. Todos los derechos reservados.</p>
      <!-- TEMPLATE CONFIGURATION -->
      <p class="mb-0 small">{{FOOTER_DESCRIPTION}}</p>
    </div>
  </footer>

  <!-- TEMPLATE CORE -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
          crossorigin="anonymous"></script>
  <script src="main.js"></script>
</body>
</html>
